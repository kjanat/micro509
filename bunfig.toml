[install]
linker = "hoisted"

[install.scopes]
jsr = "https://npm.jsr.io"

[test]
concurrentTestGlob         = "**/*{differential,fuzz}*.test.ts"
coveragePathIgnorePatterns = ["test/**", "dist/**", "packages/**", "scripts/**", ".claude/**"]
coverageReporter           = ["text", "lcov"]
coverageSkipTestFiles      = true
coverageThreshold          = 0.80                                                               # prevents bun from exiting non-zero
reporter.junit             = "test-results.xml"

[run]
noOrphans = true
