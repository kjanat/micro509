name: Cache compiler artifacts
description: Cache Go artifacts and compiler bundles independently.
inputs:
  operation:
    description: restore before installation, save after installation
    default: restore
  bun-version:
    description: Installed Bun version from setup-bun
  node-version:
    description: Installed Node.js version from setup-node
  state:
    description: JSON restore outputs passed to save
    default: "{}"
  go-path:
    description: Go artifact paths shared by restore and save
    default: |
      .cache/tsc/go
      tsc/*/bin
  bundle-path:
    description: Bundle paths shared by restore and save
    default: |
      .cache/tsc/bundles
      tsc/*/dist
outputs:
  state:
    description: Restore step outputs as JSON
    value: ${{ toJSON(steps) }}
runs:
  using: composite
  steps:
    - name: Restore Go artifacts
      id: go
      if: inputs.operation == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ format('tsc-go-{0}-{1}-{2}-{3}-{4}', runner.os, runner.arch, env.ImageOS, env.ImageVersion, hashFiles('tsc/**/*.go', 'tsc/*/go.mod', 'tsc/*/go.sum', 'tsc/*/build.ts', 'go.work*', '.tool-versions')) }}
        path: ${{ inputs.go-path }}
    - name: Restore compiler bundles
      id: bundles
      if: inputs.operation == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ format('tsc-bundles-{0}-{1}-{2}-{3}', steps.go.outputs.cache-primary-key, inputs.bun-version, inputs.node-version, hashFiles('tsc/*/src/**', 'tsc/*.ts', '!tsc/*.test.ts', 'tsc/*/package.json', 'tsc/*/tsconfig.json', 'tsc/*/tsdown.config.ts', 'bun.lock', 'tsdown.config.ts', '.dprint.json')) }}
        path: ${{ inputs.bundle-path }}
    - name: Save Go artifacts
      if: inputs.operation == 'save' && fromJSON(inputs.state).go.outputs.cache-hit != 'true' && fromJSON(inputs.state).go.outputs.cache-primary-key != '' && hashFiles('.cache/tsc/go') != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ fromJSON(inputs.state).go.outputs.cache-primary-key }}
        path: ${{ inputs.go-path }}
    - name: Save compiler bundles
      if: inputs.operation == 'save' && fromJSON(inputs.state).bundles.outputs.cache-hit != 'true' && fromJSON(inputs.state).bundles.outputs.cache-primary-key != '' && hashFiles('.cache/tsc/bundles') != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ fromJSON(inputs.state).bundles.outputs.cache-primary-key }}
        path: ${{ inputs.bundle-path }}
