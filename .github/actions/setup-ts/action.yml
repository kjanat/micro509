name: Setup Js Runtime
description: Setup Deno, Node.js, and/or Bun runtimes

inputs:
  install-runner: { description: Install runner-run, required: false, default: "true" }
  install-deno: { description: Install Deno, required: false, default: "false" }
  deno-version: { description: Deno version to install, required: false, default: "2.x" }
  install-bun: { description: Install Bun, required: false, default: "true" }
  bun-version: { description: Bun version to install, required: false, default: "latest" }
  install-node: { description: Install Node.js, required: false, default: "true" }
  node-version: { description: Node version to install, required: false, default: "file" }
  node-registry-url: { description: "npm registry URL for Node (writes auth-enabled .npmrc reading NODE_AUTH_TOKEN)", required: false, default: "" }
  update-npm: { description: "Update npm to 11", required: false, default: "true" }

outputs:
  runner-version: { description: The installed runner-run version, value: "${{ steps.setup-runner.outputs.version }}" }
  deno-version: { description: The installed Deno version, value: "${{ steps.setup-deno.outputs.deno-version }}" }
  bun-version: { description: The installed Bun version (if install-bun is true), value: "${{ steps.setup-bun.outputs.bun-version }}" }
  bun-path: { description: The installed Bun path (if install-bun is true), value: "${{ steps.setup-bun.outputs.bun-path }}" }
  node-version: { description: The installed Node.js version (if install-node is true), value: "${{ steps.setup-node.outputs.node-version }}" }
  npm-version: { description: The installed npm version (if update-npm is true), value: "${{ steps.update-npm.outputs.npm-version }}" }

runs:
  using: composite
  steps:
    - name: Setup runner-run
      id: setup-runner
      if: ${{ inputs.install-runner == 'true' }}
      uses: kjanat/runner@master

    - name: Setup Deno
      id: setup-deno
      if: ${{ inputs.install-deno == 'true' }}
      uses: denoland/setup-deno@v2
      with: { deno-version: "${{ inputs.deno-version }}" }

    - name: Setup Node
      id: setup-node
      if: ${{ inputs.install-node == 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version != 'file' && inputs.node-version || '' }}
        node-version-file: ${{ inputs.node-version == 'file' && '.node-version' || '' }}
        package-manager-cache: false
        registry-url: ${{ inputs.node-registry-url }}

    - name: Setup Bun
      id: setup-bun
      if: ${{ inputs.install-bun == 'true' }}
      uses: oven-sh/setup-bun@v2
      with: { bun-version: "${{ inputs.bun-version }}" }

    - name: Update npm
      id: update-npm
      if: ${{ inputs.install-node == 'true' && inputs.update-npm == 'true' }}
      shell: bash
      run: npm install -g npm@11 && echo "npm-version=$(npm --version)" >> "${GITHUB_OUTPUT}"
