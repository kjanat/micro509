lint:
  rules:
    security:
      cache-call-unrestricted:
        options: null
        level: on
      cache-write-untrusted:
        options: null
        level: on
    correctness:
      cache-operation:
        options: null
        level: on
      expression-reference:
        level: default
        options:
          variables: null
          secrets: null
      workflow-call:
        level: default
        options:
          default-permissions: permissive
    policy:
      disallow-suppressions:
        options: null
        level: on
      require-commit-hash:
        options: null
        level: on
      require-job-timeout:
        options: null
        level: on
      require-permissions:
        options: null
        level: on
plugins:
  - ruff
  - shellcheck
