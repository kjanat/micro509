name: Publish Any Commit
on:
  push: { branches: [master] }
  pull_request: null
concurrency:
  group: pkgpr${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { id-token: write, contents: read, pull-requests: write }
    steps:
      - { uses: actions/checkout@v7, with: { persist-credentials: false } }
      - { uses: ./.github/actions/setup-ts, with: { install-bun: true, install-node: true } }
      - run: runner install -f build
      - id: pkg-pr
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: run -q publish:pkgprnew --json pkgpr.json; echo "meta=$(jq -c . pkgpr.json)" >> "${GITHUB_OUTPUT}"
