name: autofix.ci
on:
  push: { branches: ["master"] }
  pull_request:
  workflow_call:
permissions: { contents: read }
jobs:
  autofix:
    if: ${{ github.actor != 'autofix-ci[bot]' && !contains(github.event.head_commit.message, '[autofix.ci]') }}
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v7, with: { persist-credentials: false } }
      - { uses: ./.github/actions/setup-ts, with: { install-bun: "true" } }
      - uses: kjanat/install-dprint@v1
      - run: dprint config update -yr
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      - run: dprint fmt --allow-no-files --diff --excludes .github
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
