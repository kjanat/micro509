name: Deploy Site

on: { push: { branches: [master, vitepress] }, workflow_dispatch: null }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 5
    steps: [
      { uses: actions/checkout@v7, with: { persist-credentials: false } },
      { uses: ./.github/actions/setup-ts, with: { install-bun: true, install-deno: true } },
      run: runner install -f site:build,
      { name: Verify import maps, run: run site:import-maps },
      { uses: actions/upload-pages-artifact@v5, with: { path: site/.vitepress/dist } },
    ]

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: { pages: write, id-token: write }
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps: [{ name: Deploy to GitHub Pages, id: deployment, uses: actions/deploy-pages@v5 }]
