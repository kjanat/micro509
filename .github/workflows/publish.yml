name: Publish

on:
  push: { tags: ["v*.*.*"] }
  pull_request: { branches: [master] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: { contents: read }

jobs:
  test: { name: Test, uses: ./.github/workflows/test.yml }

  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      version: ${{ steps.version.outputs.version }}
      jsr_url: ${{ steps.version.outputs.jsr_url }}
      npm_url: ${{ steps.version.outputs.npm_url }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      is_stable: ${{ steps.version.outputs.is_stable }}
      mode: ${{ steps.version.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/release-validate
        id: version
        with: { event-name: "${{ github.event_name }}", ref-name: "${{ github.ref_name }}" }

  publish-jsr:
    name: JSR (${{ needs.validate.outputs.mode }})
    needs: [test, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, id-token: write }
    environment:
      name: ${{ needs.validate.outputs.is_tag == 'true' && 'jsr' || '' }}
      url: ${{ needs.validate.outputs.is_tag == 'true' && needs.validate.outputs.jsr_url || '' }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-ts
        with: { install-bun: "true" }
      - name: Install dependencies and build (tsdown regenerates jsr.json)
        run: runner install -f build
      - shell: pwsh
        env: { OUTPUTS: "${{ toJSON(needs.validate.outputs) }}" }
        run: |
          $outputs = ConvertFrom-Json $env:OUTPUTS
          if ($outputs.is_tag -ne 'true') { bunx jsr publish --dry-run; exit $LASTEXITCODE }

          $pkg = Get-Content jsr.json | ConvertFrom-Json
          $meta = try { Invoke-RestMethod ("https://jsr.io/{0}/meta.json" -f $pkg.name) -ErrorAction Stop } catch {}
          if ($meta.versions.PSObject.Properties.Name -contains $pkg.version) { "::notice::{0}@{1} already on JSR, skipping" -f $pkg.name, $pkg.version; exit 0 }

          bunx jsr publish; exit $LASTEXITCODE

  publish-npm:
    name: npm (${{ needs.validate.outputs.mode }})
    needs: [test, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, id-token: write }
    environment:
      name: ${{ needs.validate.outputs.is_tag == 'true' && 'npm' || '' }}
      url: ${{ needs.validate.outputs.is_tag == 'true' && needs.validate.outputs.npm_url || '' }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-ts
        with: { install-bun: true, install-node: true, update-npm: true, node-registry-url: https://registry.npmjs.org }
      - run: runner install -f build
      - shell: pwsh
        env: { OUTPUTS: "${{ toJSON(needs.validate.outputs) }}" }
        run: |
          $outputs = ConvertFrom-Json $env:OUTPUTS
          $pkg = Get-Content package.json | ConvertFrom-Json
          $versionsJson = bun info $pkg.name versions --json 2>$null
          $versions = if ($LASTEXITCODE -eq 0) { $versionsJson | ConvertFrom-Json } else { @() }

          if ($versions -contains $pkg.version) { "::notice::{0}@{1} already on npm, skipping" -f $pkg.name, $pkg.version; exit 0 }
          if ($outputs.is_tag -ne 'true') { npm publish --dry-run; exit $LASTEXITCODE }

          $publishArgs = @('--provenance', '--access', 'public')
          if ($outputs.prerelease -eq 'true') { $publishArgs += @('--tag', 'beta') }

          npm publish @publishArgs; exit $LASTEXITCODE

  release:
    name: GitHub Release
    needs: [validate, publish-jsr, publish-npm]
    if: needs.validate.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - name: Publish GitHub Release
        run: |
          RELEASE_ARGS=()
          if [[ "${PRERELEASE}" == "true" ]]; then RELEASE_ARGS+=(--prerelease); fi

          gh release edit "${TAG}" --draft=false "${RELEASE_ARGS[@]}" 2>/dev/null \
          || gh release create "${TAG}" --generate-notes "${RELEASE_ARGS[@]}"

  # Freeze this release's docs as tarballs on the GitHub Release, then poke
  # the Cloudflare deploy hook so scripts/assemble-site.bun.ts re-assembles
  # the live site with the new root. Stable releases only: prereleases live
  # on /next/. Runs after publish-npm so the site root can never claim a
  # version npm does not have.
  docs-assets:
    name: Docs assets
    needs: [validate, publish-npm, release]
    if: needs.validate.outputs.is_tag == 'true' && needs.validate.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-ts
        with: { install-bun: "true" }
      - run: runner install -f
      - name: Build root flavor (served at /)
        env:
          DOCS_BASE: /
          DOCS_CHANNEL: latest
          DOCS_VERSION: v${{ needs.validate.outputs.version }}
        run: |
          bun run site:build:flavor
          tar -czf docs-root.tar.gz -C site/.vitepress/dist .
      - name: Build archive flavor (served at /vX.Y/ once superseded)
        run: |
          MINOR="v$(cut -d. -f1-2 <<<"${VERSION}")"
          echo "MINOR=${MINOR}" >> "${GITHUB_ENV}"
          DOCS_BASE="/${MINOR}/" DOCS_CHANNEL=archive DOCS_VERSION="${MINOR}" bun run site:build:flavor
          tar -czf "docs-${MINOR}.tar.gz" -C site/.vitepress/dist .
      - name: Attach tarballs to the release
        run: gh release upload "${TAG}" docs-root.tar.gz "docs-${MINOR}.tar.gz" --clobber
      - name: Trigger docs deploy
        env: { HOOK: "${{ secrets.CF_DEPLOY_HOOK_URL }}" }
        run: |
          if [ -n "${HOOK}" ]; then
            curl -fsS -X POST "${HOOK}"
          else
            echo "::warning::CF_DEPLOY_HOOK_URL unset; the next master push refreshes the site root"
          fi
