name: OpenSSL
on:
  schedule: [cron: "23 5 * * *"]
  workflow_dispatch:
    inputs:
      version:
        description: "Also publish this OpenSSL release, e.g. 3.5.5"
        type: string
        default: ""
        required: false
      force:
        description: Rebuild versions that are already published
        type: boolean
        default: false
        required: false

permissions: { contents: read }

env:
  IMAGE: ${{ format('ghcr.io/{0}/openssl', github.repository_owner) }}
  PREBUILT: ${{ format('ghcr.io/{0}/openssl-prebuilt', github.repository_owner) }}
  FORCE: ${{ inputs.force || false }}

defaults: { run: { shell: "bash -euo pipefail {0}" } }

jobs:
  resolve:
    name: Resolve versions
    if: github.repository == 'kjanat/micro509'
    runs-on: &Ubuntu ubuntu-26.04
    timeout-minutes: 5
    permissions: { contents: read, packages: read }
    outputs:
      releases: ${{ steps.resolve.outputs.releases }}
      publishes: ${{ steps.resolve.outputs.publishes }}
      latest: ${{ steps.resolve.outputs.latest }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - &SafeCheckout { uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1, with: { persist-credentials: false } } # v7
      - &SetupOras { uses: &Oras oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d } # v2.0.1
      - &LoginDocker
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: &GHToken "${{ github.token }}" }
      - id: resolve
        env:
          GH_TOKEN: *GHToken
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force || false }}
        run: |
          retry() {
            local attempt status delay=2
            for attempt in 1 2 3 4; do
              if "$@"; then return 0; else status=$?; fi
              if ((attempt == 4)); then return "${status}"; fi
              printf 'Request failed (exit %s); retrying in %ss (attempt %s/4).\n' "${status}" "${delay}" "$((attempt + 1))" >&2
              sleep "${delay}"; delay=$((delay * 2))
            done
          }
          pattern='^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)[0-9]+)?$'
          latest="$(retry gh api repos/openssl/openssl/releases/latest --jq .tag_name)"
          latest="${latest#openssl-}"
          prerelease="$(retry gh api 'repos/openssl/openssl/releases?per_page=100' --jq '[.[] | select(.prerelease and (.draft | not))][0].tag_name // empty')"
          prerelease="${prerelease#openssl-}"
          printf 'latest=%s\nprerelease=%s\n' "${latest}" "${prerelease}" >> "${GITHUB_OUTPUT}"

          declare -A seen=()
          entries=()
          for version in "${latest}" "${prerelease}" "${VERSION}"; do
            if [[ -z "${version}" || -v "seen[${version}]" ]]; then continue; fi
            seen["${version}"]=1
            if [[ ! "${version}" =~ ${pattern} ]]; then
              echo "::error::${version} is not an OpenSSL release such as 3.5.5 or 4.1.0-beta1."
              exit 1
            fi
            if [[ "${FORCE}" != true ]] && oras resolve "${IMAGE}:${version}" && oras resolve "${PREBUILT}:${version}"; then
              echo "::notice::${IMAGE}:${version} and ${PREBUILT}:${version} are already published"
              continue
            fi
            export ASSET="openssl-${version}.tar.gz"
            digest="$(retry gh api "repos/openssl/openssl/releases/tags/openssl-${version}" --jq '.assets[] | select(.name == env.ASSET) | .digest')"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${ASSET} has no SHA-256 digest on its release."
              exit 1
            fi
            entries+=("$(jq -cn --arg version "${version}" --arg sha256 "${digest#sha256:}" '{version: $version, sha256: $sha256}')")
          done
          printf '%s\n' "${entries[@]}" | jq -rs '"releases=\(tojson)", "publishes=\(["none"] + . | tojson)"' >> "${GITHUB_OUTPUT}"

  image:
    name: Image ${{ matrix.release.version }}
    needs: resolve
    if: &ReleasesNonEmpty needs.resolve.outputs.releases != '[]'
    runs-on: *Ubuntu
    timeout-minutes: 30
    permissions: &WritePkgAttestIdToken { contents: read, packages: write, id-token: write, attestations: write }
    strategy: { fail-fast: false, matrix: { release: "${{ fromJSON(needs.resolve.outputs.releases) }}" } }
    steps:
      - *SafeCheckout
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - *LoginDocker
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: &Image ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ matrix.release.version }}
          labels: &DockerMeta |
            org.opencontainers.image.title=openssl
            org.opencontainers.image.description=OpenSSL ${{ matrix.release.version }}, statically linked, built from the upstream release tarball
            org.opencontainers.image.version=${{ matrix.release.version }}
            org.opencontainers.image.licenses=Apache-2.0
          annotations: *DockerMeta
      - name: Build and export SBOMs
        uses: &DockerBP docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: &DockerCtx .github/openssl
          build-args: &BuildArgs |
            VERSION=${{ matrix.release.version }}
            SHA256=${{ matrix.release.sha256 }}
          provenance: false
          sbom: true
          outputs: type=local,dest=${{ runner.temp }}/export
      - name: Push
        id: push
        if: &IsMaster github.ref == 'refs/heads/master'
        uses: *DockerBP
        with:
          context: *DockerCtx
          build-args: *BuildArgs
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Unwrap SPDX documents and pack the linux-x64 tarball
        working-directory: ${{ runner.temp }}
        env:
          v: &MatrixRelease ${{ matrix.release.version }}
          spdx_image: ${{ runner.temp }}/image.spdx.json
          spdx_build: ${{ runner.temp }}/build.spdx.json
        run: |
          printf 'spdx_image=%s\nspdx_build=%s\n' "${spdx_image}" "${spdx_build}" >> "${GITHUB_ENV}"
          jq '.predicate' "export/sbom.spdx.json"       > "${spdx_image}"
          jq '.predicate' "export/sbom-build.spdx.json" > "${spdx_build}"
          tar -C export/usr/local -czf "openssl-${v}-linux-x64.tar.gz" .
      - uses: &Attest actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: *IsMaster
        with:
          subject-name: *Image
          subject-digest: &Digest ${{ steps.push.outputs.digest }}
          create-storage-record: false
      - uses: *Attest
        if: *IsMaster
        with:
          subject-name: *Image
          subject-digest: *Digest
          sbom-path: ${{ env.spdx_image }}
          create-storage-record: false
      - uses: *Attest
        if: *IsMaster
        with:
          subject-name: *Image
          subject-digest: *Digest
          sbom-path: ${{ env.spdx_build }}
          create-storage-record: false
      - uses: &Upload actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssl-${{ matrix.release.version }}-linux-x64
          path: ${{ runner.temp }}/openssl-${{ matrix.release.version }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  tarball:
    name: ${{ matrix.release.version }} ${{ matrix.platform }}
    needs: resolve
    if: *ReleasesNonEmpty
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.resolve.outputs.releases) }}
        platform: [linux-arm64, darwin-x64, darwin-arm64, windows-x64, windows-arm64]
        # pretty-yaml-ignore
        include: [
          { platform: darwin-arm64,  runner: macos-15 },
          { platform: darwin-x64,    runner: macos-15-intel },
          { platform: linux-arm64,   runner: ubuntu-26.04-arm },
          { platform: windows-arm64, runner: windows-11-vs2026-arm, msvc-arch: arm64, configure-target: VC-WIN64-CLANGASM-ARM, tool: clang-cl },
          { platform: windows-x64,   runner: windows-2025-vs2026,   msvc-arch: x64,   configure-target: VC-WIN64A,             tool: nasm },
        ]
    env:
      VERSION: *MatrixRelease
      SHA256: ${{ matrix.release.sha256 }}
      ARCHIVE: openssl-${{ matrix.release.version }}-${{ matrix.platform }}.tar.gz
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - *SafeCheckout
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          docker buildx build \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "SHA256=${SHA256}" \
            --output "type=local,dest=${RUNNER_TEMP}/export" .github/openssl

          "${RUNNER_TEMP}/export/usr/local/bin/openssl" version -a

          tar -C "${RUNNER_TEMP}/export/usr/local" -czf "${RUNNER_TEMP}/${ARCHIVE}" .
      - name: Download and verify the release tarball
        if: runner.os != 'Linux'
        env: { GH_TOKEN: *GHToken, GH_REPO: openssl/openssl }
        run: |
          retry() {
            local attempt status delay=2
            for attempt in 1 2 3 4; do
              if "$@"; then return 0; else status=$?; fi
              if ((attempt == 4)); then return "${status}"; fi
              printf 'Request failed (exit %s); retrying in %ss (attempt %s/4).\n' "${status}" "${delay}" "$((attempt + 1))" >&2
              sleep "${delay}"; delay=$((delay * 2))
            done
          }
          retry gh release download "openssl-${VERSION}" --pattern "openssl-${VERSION}.tar.gz" --dir "${RUNNER_TEMP}" --clobber

          cd "${RUNNER_TEMP}"
          checksum=(sha256sum)
          if [[ "${RUNNER_OS}" == macOS ]]; then checksum=(shasum -a 256); fi
          printf '%s  %s\n' "${SHA256}" "openssl-${VERSION}.tar.gz" | "${checksum[@]}" --check
          tar -xzf "openssl-${VERSION}.tar.gz"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: &TmpOV ${{ runner.temp }}/openssl-${{ matrix.release.version }}
        env: { DESTDIR: "${{ runner.temp }}/root", PFX: "/usr/local" }
        run: |
          ./Configure --prefix="${PFX}" --openssldir="${PFX}/ssl" --libdir=lib no-shared no-module no-tests
          jobs="$(sysctl -n hw.ncpu)"

          make -j"${jobs}" build_sw
          make DESTDIR="${DESTDIR}" install_sw install_ssldirs

          "${DESTDIR}${PFX}/bin/openssl" version -a

          otool -L "${DESTDIR}${PFX}/bin/openssl"
          tar -C "${DESTDIR}${PFX}" -czf "${RUNNER_TEMP}/${ARCHIVE}" .
      - name: Probe preinstalled toolchain
        if: &IsWindows runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env: { MATRIX: "${{ toJSON(matrix) }}" }
        run: |
          $tool       = $env:MATRIX | ConvertFrom-Json | Select-Object -ExpandProperty 'tool'
          $missing    = @()
          $tools      = @('perl', 'cl', 'link', 'nmake', 'vswhere', $tool)
          foreach ($tool in $tools) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($command) {
              '{0,-18} {1}' -f $tool, $command.Source
            } else {
              $missing += $tool; '{0,-18} missing' -f $tool
            }
          }
          foreach ($name in @('INCLUDE', 'LIB', 'VCToolsInstallDir', 'WindowsSdkDir')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) {
              '{0,-18} {1}' -f $name, $value
            } else {
              $missing += $name; '{0,-18} unset' -f $name
            }
          }
          if ($missing) { "::warning::Not present before setup: $($missing -join ', ')"; exit 1 }
      - name: Install NASM
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env: { NASM: '{ "version": "2.16.01", "sha256": "029eed31faf0d2c5f95783294432cbea6c15bf633430f254bb3c1f195c67ca3a" }' }
        run: |
          $ErrorActionPreference = 'Stop'
          $nasm        = $env:NASM | ConvertFrom-Json
          $nasmVersion = $nasm.version
          $nasmSha256  = $nasm.sha256
          $zipName     = "nasm-{0}-win64.zip" -f $nasmVersion
          $tmp         = $env:RUNNER_TEMP
          $zip         = Join-Path $tmp $zipName
          $zipUrl      = "https://www.nasm.us/pub/nasm/releasebuilds/{0}/win64/{1}" -f $nasmVersion, $zipName

          Invoke-WebRequest -Uri $zipUrl -OutFile $zip -MaximumRetryCount 4 -RetryIntervalSec 2

          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $nasmSha256) { throw "$zipName has SHA-256 $actual" }

          Expand-Archive -Path $zip -DestinationPath $tmp
          Join-Path $tmp "nasm-$nasmVersion" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build (Windows)
        if: *IsWindows
        shell: pwsh
        env: { MATRIX: "${{ toJSON(matrix) }}" }
        working-directory: *TmpOV
        run: |
          $ErrorActionPreference                   = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $matrix     = $env:MATRIX | ConvertFrom-Json
          $confTarget = $matrix.'configure-target'
          $msvcArch   = $matrix.'msvc-arch'
          $tool       = $matrix.'tool'
          $prefix     = 'C:/openssl'
          $openssl    = Join-Path $prefix "bin" "openssl.exe"
          $archive    = Join-Path $env:RUNNER_TEMP $env:ARCHIVE
          $vcvars     = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -find 'VC/Auxiliary/Build/vcvarsall.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'vcvarsall.bat not found' }

          $cmd = '"{0}" {1} >NUL && set' -f $vcvars, $msvcArch

          cmd /c $cmd | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Set-Item -Path "env:$($Matches[1])" -Value $Matches[2]
            }
          }

          Get-Command perl, nmake, cl, $tool | Format-Table -Property Name, Source

          $options = @($confTarget, "--prefix=$prefix", "--openssldir=$(Join-Path $prefix "ssl")", 'no-shared', 'no-module', 'no-tests')
          if (Select-String -Path Configure -Pattern 'static-vcruntime' -Quiet) { $options += 'enable-static-vcruntime' }
          & perl Configure @options

          & nmake build_sw
          & nmake install_sw install_ssldirs
          & $openssl version -a

          & dumpbin /dependents $openssl
          & tar -C $prefix -czf $archive .
      - uses: *Upload
        with:
          name: openssl-${{ matrix.release.version }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tarballs ${{ matrix.release.version || 'none' }}
    needs: [resolve, image, tarball]
    if: *IsMaster
    runs-on: *Ubuntu
    timeout-minutes: 10
    permissions: *WritePkgAttestIdToken
    strategy: { fail-fast: false, matrix: { release: "${{ fromJSON(needs.resolve.outputs.publishes) }}", exclude: [release: none] } }
    steps:
      - parallel:
          - if: &Release matrix.release
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              pattern: openssl-${{ matrix.release.version }}-*
              merge-multiple: true
              path: &PublishArtefact ${{ runner.temp }}/dist
          - if: *Release
            uses: *Oras
      - if: *Release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-path: "${{ runner.temp }}/dist/*.tar.gz" }
      - name: Push to GHCR
        if: *Release
        working-directory: *PublishArtefact
        env: { GH_TOKEN: *GHToken, v: *MatrixRelease }
        run: |
          ls -l
          files=()
          for file in *.tar.gz; do files+=("${file}:application/vnd.oci.image.layer.v1.tar+gzip"); done
          oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"
          oras push "${PREBUILT}:${v}" --no-tty \
            --artifact-type application/vnd.kjanat.openssl.prebuilt.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${v}" \
            --annotation "org.opencontainers.image.title=openssl-prebuilt" \
            --annotation "org.opencontainers.image.description=OpenSSL ${v} tarballs for linux-x64, linux-arm64, darwin-x64, darwin-arm64, windows-x64, windows-arm64" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0" \
            "${files[@]}"

  tags:
    name: Floating tags
    needs: [resolve, image, tarball, publish]
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.resolve.result == 'success' && needs.image.result != 'failure' && needs.tarball.result != 'failure' && needs.publish.result != 'failure' }}
    runs-on: *Ubuntu
    timeout-minutes: 5
    permissions: { contents: read, packages: write }
    steps:
      - *SetupOras
      - *LoginDocker
      - name: Point latest and beta
        env: { latest: "${{ needs.resolve.outputs.latest }}", prerelease: "${{ needs.resolve.outputs.prerelease }}" }
        run: |
          for repository in "${IMAGE}" "${PREBUILT}"; do
            oras tag "${repository}:${latest}" latest
            if [[ -n "${prerelease}" ]]; then oras tag "${repository}:${prerelease}" beta; fi
          done
