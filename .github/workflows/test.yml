name: Test

on:
  pull_request: { branches: [master] }
  push: { branches: [master] }
  workflow_call: # callable so Publish can gate releases on a green suite

# No `concurrency` here: when Publish calls this via workflow_call, `github.workflow`
# resolves to the caller ("Publish"), so a shared group would deadlock caller vs callee.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ts
        with: { install-bun: "true", install-node: "true", install-deno: "true" }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Build (runs attw + publint + unused-export checks)
        run: bun run build
      - name: Validate npm tarball against published exports
        run: bun scripts/check-npm-pack.ts
      - name: Node smoke test (dist)
        run: node scripts/smoke.mjs
      - name: Deno smoke test (dist)
        run: deno run --allow-read scripts/smoke.mjs

  differential:
    name: OpenSSL differential (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    container:
      # oven/bun:1.3.14-debian — digest-pinned so the bundled OpenSSL never
      # moves under the oracle (version drift breaks name formatting/verdicts).
      image: oven/bun@sha256:9dba1a1b43ce28c9d7931bfc4eb00feb63b0114720a0277a8f939ae4dfc9db6f
    steps:
      - uses: actions/checkout@v7
      - run: openssl version
      - run: bun install --frozen-lockfile
      - name: Run OpenSSL differential harness
        run: bun run test:differential
        env: { DIFFERENTIAL_OPENSSL: "1" }
