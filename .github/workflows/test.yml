name: Test

on:
  pull_request: { branches: [master] }
  push: { branches: [master] }
  workflow_call: # callable so Publish can gate releases on a green suite

# No `concurrency` here: when Publish calls this via workflow_call, `github.workflow`
# resolves to the caller ("Publish"), so a shared group would deadlock caller vs callee.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-ts
        with: { install-bun: "true", install-node: "true", install-deno: "true" }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Deno lint + type-check + doc-lint (full source tree)
        run: |
          deno lint src
          deno check src
          deno doc --lint src
      - run: bun run test
      - name: Build (runs attw + publint + unused-export checks)
        run: bun run build
      - name: Validate npm tarball against published exports
        run: bun scripts/check-npm-pack.ts
      - name: Node smoke test (dist)
        run: node scripts/smoke.mjs
      - name: Deno smoke test (dist)
        run: deno run --allow-read scripts/smoke.mjs

  runtime-smoke:
    name: Workerd + browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-ts
        with: { install-bun: "true", install-node: "true" }
      - run: bun install --frozen-lockfile
      - run: bun run bd
      - run: npx playwright install --with-deps chromium
      - name: Workers smoke test (workerd)
        run: node scripts/smoke-workerd.mjs
      - name: Browser smoke test (chromium, dist)
        run: node scripts/smoke-browser.mjs

  differential:
    name: OpenSSL differential
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-ts
        with: { install-bun: "true" }
      - run: openssl version
      - run: bun install --frozen-lockfile
      - run: bun run test:differential
        env: { DIFFERENTIAL_OPENSSL: "1" }
